<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Career journey from 2019 to today">
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131a24"/></linearGradient>
  <style>
    .in { opacity:0; animation: fade .6s ease-out forwards; }
    .grow { transform-origin: 110px 150px; transform: scaleX(0); animation: grow 1.4s ease-out forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  </style>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#30363d"/>
<rect x="110" y="148.5" width="815" height="3" rx="1.5" fill="url(#acc)" class="grow"/><line x1="925" y1="150" x2="1088" y2="150" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>
