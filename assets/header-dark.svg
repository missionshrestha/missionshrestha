<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mission Shrestha, Software Engineer">
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131a24"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1d232b"/></pattern>
  <style>
    .in { opacity:0; animation: up .8s ease-out forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .trail { fill:none; stroke:#58a6ff; stroke-width:1.5; stroke-dasharray:4 6; opacity:.6; animation: flow 1.4s linear infinite; }
    @keyframes up { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
    @keyframes flow { to { stroke-dashoffset:-20; } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  </style>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#30363d"/>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#dots)" opacity=".8"/>
<text x="64" y="84" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e" class="in">hello, I'm</text>
<text x="62" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#e6edf3" class="in" style="animation-delay:.1s">Mission Shrestha</text>
<text x="64" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#acc)" class="in" style="animation-delay:.2s">Software Engineer</text>
<text x="64" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" class="in" style="animation-delay:.3s">I build software end to end: the interface, the APIs, the data, and the cloud underneath.</text>
<g class="in" style="animation-delay:.45s">
  <rect x="64" y="244" width="168" height="28" rx="14" fill="#1f2a3a"/>
  <text x="148" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9ecbff">Kathmandu, Nepal</text>
  <rect x="242" y="244" width="168" height="28" rx="14" fill="#1f2a3a"/>
  <circle cx="262" cy="258" r="4.5" fill="#3fb950" class="pulse"/>
  <text x="275" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9ecbff">Open to new roles</text>
</g>
<g class="in" style="animation-delay:0.20s"><rect x="800" y="46" width="300" height="36" rx="9" fill="#161b22" stroke="#30363d"/><rect x="800" y="46" width="4" height="36" rx="2" fill="url(#acc)"/><text x="822" y="69" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3">Interface</text><circle cx="1080" cy="64.0" r="4" fill="#3fb950" opacity=".85"/></g>
<g class="in" style="animation-delay:0.32s"><rect x="814" y="90" width="300" height="36" rx="9" fill="#161b22" stroke="#30363d"/><rect x="814" y="90" width="4" height="36" rx="2" fill="url(#acc)"/><text x="836" y="113" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3">APIs</text><circle cx="1094" cy="108.0" r="4" fill="#3fb950" opacity=".85"/></g>
<g class="in" style="animation-delay:0.44s"><rect x="828" y="134" width="300" height="36" rx="9" fill="#161b22" stroke="#30363d"/><rect x="828" y="134" width="4" height="36" rx="2" fill="url(#acc)"/><text x="850" y="157" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3">Data</text><circle cx="1108" cy="152.0" r="4" fill="#3fb950" opacity=".85"/></g>
<g class="in" style="animation-delay:0.56s"><rect x="842" y="178" width="300" height="36" rx="9" fill="#161b22" stroke="#30363d"/><rect x="842" y="178" width="4" height="36" rx="2" fill="url(#acc)"/><text x="864" y="201" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3">Cloud</text><circle cx="1122" cy="196.0" r="4" fill="#3fb950" opacity=".85"/></g>
<g class="in" style="animation-delay:0.68s"><rect x="856" y="222" width="300" height="36" rx="9" fill="#161b22" stroke="#30363d"/><rect x="856" y="222" width="4" height="36" rx="2" fill="url(#acc)"/><text x="878" y="245" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3">AI</text><circle cx="1136" cy="240.0" r="4" fill="#3fb950" opacity=".85"/></g>
</svg>
